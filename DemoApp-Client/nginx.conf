# DemoApp-Client/nginx.conf

server {
    listen 80;
    server_name localhost;

    resolver 8.8.8.8 valid=30s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;
    }

    # REVERSE PROXY: Captures /api/ and routes it cleanly over the web
    location /api/ {
        set $target $BACKEND_URL;

        # FIXED: Removed the trailing /api/ rewrite parameters from the proxy pass string.
        # This tells Nginx to preserve the incoming "/api" prefix completely when forwarding
        # the request, matching the C# [Route("api/[controller]")] templates
        proxy_pass $target;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_ssl_server_name on;

        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
