# DemoApp-Client/nginx.conf

server {
    listen 80;
    server_name localhost;

    # FIXED: Instructs Nginx to use standard cloud DNS resolvers
    # to dynamically find Render's backend URLs without dropping connections.
    resolver 8.8.8.8 valid=30s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;
    }

    # REVERSE PROXY: Captures /api/ and routes it cleanly over the web
    location /api/ {
        # Using a variable forcing dynamic evaluation prevents startup connection caching crashes
        set $target $BACKEND_URL;

        proxy_pass $target/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
